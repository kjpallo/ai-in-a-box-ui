<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlemagne Student Help</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .student-shell {
        width: min(1080px, calc(100% - 1rem));
        height: 100dvh;
        margin: 0 auto;
        padding: 0.5rem 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0.5rem;
      }

      .student-status-bar,
      .student-composer {
        min-width: 0;
        padding: 0.56rem 0.62rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 8px;
        background:
          radial-gradient(circle at 12% 0%, rgba(102,247,209,0.12), transparent 36%),
          radial-gradient(circle at 90% 0%, rgba(126,233,255,0.1), transparent 32%),
          rgba(3,12,14,0.9);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(102,247,209,0.08);
      }

      .student-status-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(150px, 210px);
        align-items: center;
        gap: 0.5rem;
      }

      .student-status-copy {
        display: grid;
        gap: 0.22rem;
        min-width: 0;
      }

      .student-status-title {
        margin: 0;
        color: #f5fffb;
        font-size: clamp(0.95rem, 1.5vw, 1.16rem);
        letter-spacing: 0.08em;
        line-height: 1.08;
        text-transform: uppercase;
      }

      .student-status-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.75rem;
        align-items: center;
        min-width: 0;
      }

      .student-session {
        margin: 0;
        color: #b9d8d1;
        font-size: 0.78rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .student-status-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .student-energy {
        display: grid;
        align-content: center;
        gap: 0.16rem;
        min-width: 0;
        padding: 0.28rem 0.38rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 7px;
        background: rgba(4,14,17,0.62);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 22px rgba(102,247,209,0.08);
      }

      .student-energy[hidden] {
        display: none;
      }

      .student-energy-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.45rem;
        color: #dffdf6;
        font-size: 0.72rem;
      }

      .student-energy-top strong {
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-energy-value {
        color: #b9d8d1;
        font-size: 0.72rem;
        text-align: right;
      }

      .student-energy-helper {
        color: #7ee9ff;
        font-size: 0.68rem;
        line-height: 1.2;
      }

      .student-energy-track {
        height: 6px;
        padding: 1px;
        border: 1px solid rgba(126,233,255,0.3);
        border-radius: 999px;
        background: rgba(0,0,0,0.38);
        box-shadow: inset 0 0 12px rgba(0,0,0,0.42);
      }

      .student-energy-fill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #66f7d1, #7ee9ff);
        box-shadow: 0 0 14px rgba(102,247,209,0.56), 0 0 22px rgba(126,233,255,0.26);
        transition: width 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .student-energy.is-low .student-energy-fill {
        background: linear-gradient(90deg, #ffd666, #ff9f43);
        box-shadow: 0 0 14px rgba(255,214,102,0.48), 0 0 24px rgba(255,159,67,0.22);
      }

      .student-energy.is-empty .student-energy-fill {
        background: linear-gradient(90deg, #7f1d1d, #ff6b6b);
        box-shadow: 0 0 14px rgba(255,107,107,0.38);
      }

      .student-energy.is-off .student-energy-track {
        border-color: rgba(102,247,209,0.24);
      }

      .student-timeline {
        min-height: 0;
        width: 100%;
        padding: 0.65rem;
        display: grid;
        align-content: start;
        gap: 0.72rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        border: 1px solid rgba(102,247,209,0.18);
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(4,16,18,0.92), rgba(2,8,10,0.94)),
          rgba(2,8,10,0.94);
      }

      .student-empty-timeline {
        align-self: center;
        justify-self: center;
        max-width: 36rem;
        padding: 1rem;
        border: 1px solid rgba(126,233,255,0.18);
        border-radius: 10px;
        background: rgba(2,8,10,0.42);
        color: #b9d8d1;
        line-height: 1.45;
        text-align: center;
      }

      .student-chat-turn {
        display: grid;
        gap: 0.38rem;
      }

      .student-chat-message {
        display: grid;
        gap: 0.25rem;
        max-width: min(940px, 88%);
      }

      .student-chat-message.is-user {
        justify-self: end;
        max-width: min(760px, 76%);
      }

      .student-chat-message.is-assistant,
      .student-chat-message.is-system {
        justify-self: start;
      }

      .student-chat-message.has-tutor {
        max-width: min(1000px, 94%);
      }

      .student-chat-message.has-flashcard-session {
        max-width: min(760px, 92%);
      }

      .student-message-meta {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex-wrap: wrap;
        color: #b9d8d1;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-chat-message.is-user .student-message-meta {
        justify-content: flex-end;
      }

      .student-message-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .student-message-bubble {
        padding: 0.66rem 0.78rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 10px;
        color: #effff8;
        line-height: 1.42;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .student-chat-message.is-user .student-message-bubble {
        border-color: rgba(126,233,255,0.32);
        background:
          linear-gradient(180deg, rgba(17,57,66,0.88), rgba(5,24,29,0.9));
      }

      .student-chat-message.is-assistant .student-message-bubble {
        border-color: rgba(102,247,209,0.24);
        background:
          linear-gradient(180deg, rgba(5,29,29,0.78), rgba(2,12,14,0.88));
      }

      .student-chat-message.is-system .student-message-bubble {
        border-color: rgba(255,214,102,0.34);
        background: rgba(31, 22, 5, 0.62);
        color: #fff5ce;
      }

      .student-chat-message.is-pending .student-message-bubble {
        color: rgba(223,253,246,0.68);
        font-style: italic;
      }

      .student-chat-message.has-tutor .student-message-bubble {
        padding: 0.44rem;
      }

      .student-tutor-feedback {
        margin: 0 0 0.4rem;
        color: #dffdf6;
        font-size: 0.9rem;
        line-height: 1.3;
        white-space: normal;
      }

      .student-route-chip {
        color: #7ee9ff;
        letter-spacing: 0;
        text-transform: none;
      }

      .student-inline-button,
      .student-tutor-session-toggle,
      .student-tutor-control,
      .panel-action-button,
      .student-tutor-choice-button,
      .student-composer-choice-button,
      .flashcard-session-action,
      .student-calculator-use-result {
        min-height: 32px;
        padding: 0.42rem 0.64rem;
        border: 1px solid rgba(126,233,255,0.52);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 18%, rgba(239,255,248,0.2), transparent 22%),
          radial-gradient(circle at 50% 28%, rgba(126,233,255,0.2), transparent 58%),
          linear-gradient(180deg, rgba(22,72,82,0.98), rgba(5,28,34,0.98));
        color: #effff8;
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0;
        box-shadow:
          0 3px 0 rgba(3,20,24,0.92),
          0 0 18px rgba(126,233,255,0.16),
          inset 0 1px 0 rgba(255,255,255,0.16);
        transition: transform 110ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .student-inline-button:hover,
      .student-inline-button:focus-visible,
      .student-tutor-session-toggle:hover,
      .student-tutor-session-toggle:focus-visible,
      .student-tutor-control:hover,
      .student-tutor-control:focus-visible,
      .panel-action-button:hover,
      .panel-action-button:focus-visible,
      .student-tutor-choice-button:hover,
      .student-tutor-choice-button:focus-visible,
      .student-composer-choice-button:hover,
      .student-composer-choice-button:focus-visible,
      .flashcard-session-action:hover,
      .flashcard-session-action:focus-visible,
      .student-calculator-use-result:hover,
      .student-calculator-use-result:focus-visible {
        border-color: rgba(102,247,209,0.78);
        box-shadow:
          0 3px 0 rgba(3,20,24,0.92),
          0 0 24px rgba(102,247,209,0.28),
          inset 0 1px 0 rgba(255,255,255,0.22);
        outline: none;
      }

      .student-inline-button:active,
      .student-tutor-session-toggle:active,
      .student-tutor-control:active,
      .panel-action-button:active,
      .student-tutor-choice-button:active,
      .student-composer-choice-button:active,
      .flashcard-session-action:active,
      .student-calculator-use-result:active {
        transform: translateY(2px);
        box-shadow:
          0 1px 0 rgba(3,20,24,0.92),
          0 0 24px rgba(126,233,255,0.32);
      }

      .student-inline-button:disabled,
      .student-tutor-session-toggle:disabled,
      .student-tutor-control:disabled,
      .panel-action-button:disabled,
      .student-tutor-choice-button:disabled,
      .student-composer-choice-button:disabled,
      .flashcard-session-action:disabled,
      .student-calculator-use-result:disabled {
        border-color: rgba(126,233,255,0.18);
        background: rgba(6,20,23,0.62);
        color: rgba(223,253,246,0.5);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        transform: none;
      }

      .student-tutor-control {
        font-family: inherit;
        cursor: pointer;
      }

      .student-tutor-control--choice {
        border-color: rgba(126,233,255,0.52);
      }

      .student-tutor-control--helper {
        border-color: rgba(255,214,102,0.62);
      }

      .student-tutor-control--workspace {
        border-color: rgba(126,233,255,0.32);
      }

      .student-tutor-control--tool {
        border-color: rgba(126,233,255,0.42);
      }

      .student-tutor-control--danger {
        border-color: rgba(255,150,126,0.64);
        background:
          radial-gradient(circle at 50% 18%, rgba(255,255,255,0.16), transparent 22%),
          linear-gradient(180deg, rgba(84,33,26,0.98), rgba(39,15,16,0.98));
        color: #ffe4dc;
      }

      .student-tutor-control--danger:hover,
      .student-tutor-control--danger:focus-visible {
        border-color: rgba(255,190,170,0.84);
        box-shadow:
          0 3px 0 rgba(24,6,7,0.92),
          0 0 22px rgba(255,150,126,0.22),
          inset 0 1px 0 rgba(255,255,255,0.2);
      }

      .student-composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.48rem;
      }

      .student-composer textarea {
        width: 100%;
        min-height: 52px;
        max-height: 120px;
        resize: vertical;
      }

      .student-composer-tutor-choices {
        grid-column: 1 / -1;
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: stretch;
        padding: 0.46rem;
        border: 1px solid rgba(102,247,209,0.34);
        border-radius: 10px;
        background: rgba(3,22,25,0.82);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
      }

      .student-composer-tutor-choices[hidden] {
        display: none;
      }

      .student-composer-choice-button {
        flex: 1 1 150px;
        min-height: 42px;
        border-radius: 8px;
        text-align: left;
        line-height: 1.18;
        white-space: normal;
      }

      .flashcard-session-card {
        display: grid;
        gap: 0.5rem;
        min-width: 0;
        padding: 0.64rem;
        border: 1px solid rgba(255,214,102,0.34);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(37,28,9,0.72), rgba(4,17,18,0.82));
        color: #effff8;
        white-space: normal;
      }

      .flashcard-session-card.is-complete {
        border-color: rgba(102,247,209,0.44);
        background:
          linear-gradient(180deg, rgba(7,41,35,0.72), rgba(3,16,18,0.84));
      }

      .flashcard-session-title {
        color: #f5fffb;
        font-size: 0.98rem;
        font-weight: 850;
        line-height: 1.18;
        overflow-wrap: anywhere;
      }

      .flashcard-session-progress {
        margin: 0;
        color: #ffd666;
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .flashcard-session-front {
        margin: 0;
        padding: 0.52rem 0.58rem;
        border: 1px solid rgba(126,233,255,0.14);
        border-radius: 7px;
        background: rgba(2,8,10,0.34);
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .flashcard-session-back {
        margin: 0;
        padding: 0.52rem 0.58rem;
        border: 1px solid rgba(126,233,255,0.14);
        border-radius: 7px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        border-color: rgba(102,247,209,0.3);
        background: rgba(7,31,27,0.48);
        color: #dffdf6;
        font-weight: 760;
      }

      .flashcard-session-actions {
        display: flex;
        gap: 0.36rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .flashcard-session-action {
        min-height: 38px;
        border-radius: 8px;
      }

      .student-composer-actions {
        display: grid;
        grid-template-columns: minmax(68px, 0.8fr) repeat(3, minmax(48px, auto));
        align-items: center;
        gap: 0.34rem;
        min-width: 0;
        width: min(430px, 44vw);
      }

      .student-send-button {
        grid-column: auto;
        min-height: 40px;
        border-color: rgba(102,247,209,0.56);
        color: #dffdf6;
        background:
          radial-gradient(circle at 50% 0%, rgba(102,247,209,0.18), transparent 55%),
          linear-gradient(180deg, rgba(13,48,47,0.98), rgba(3,22,25,0.98));
      }

      .student-highlight-button,
      .student-point-button,
      .student-clear-button {
        min-height: 32px;
        padding-inline: 0.5rem;
        font-size: 0.72rem;
        line-height: 1.18;
      }

      .student-clear-button {
        border-color: rgba(126,233,255,0.26);
        color: #b9d8d1;
        background: rgba(6,20,23,0.62);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .student-tutor-session {
        justify-self: start;
        display: grid;
        gap: 0.5rem;
        width: min(1000px, 94%);
        padding: 0.58rem;
        border: 1px solid rgba(102,247,209,0.3);
        border-radius: 10px;
        background:
          radial-gradient(circle at 16% 0%, rgba(102,247,209,0.12), transparent 34%),
          radial-gradient(circle at 90% 8%, rgba(126,233,255,0.1), transparent 30%),
          linear-gradient(180deg, rgba(5,29,29,0.84), rgba(2,12,14,0.92));
        color: #effff8;
        white-space: normal;
      }

      .student-tutor-session.is-complete {
        border-color: rgba(102,247,209,0.5);
      }

      .student-tutor-session.is-stopped {
        border-color: rgba(255,214,102,0.42);
      }

      .student-tutor-session-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.62rem;
      }

      .student-tutor-session-summary {
        display: grid;
        gap: 0.16rem;
        min-width: 0;
      }

      .student-tutor-session-summary strong {
        color: #f5fffb;
        font-size: 0.94rem;
        line-height: 1.18;
        overflow-wrap: anywhere;
      }

      .student-tutor-session-summary span {
        color: #7ee9ff;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-tutor-session-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.38rem;
        flex-wrap: wrap;
        color: #b9d8d1;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .student-tutor-session-panel {
        max-height: min(980px, calc(100dvh - 11rem));
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition: max-height 220ms ease, opacity 180ms ease, visibility 180ms ease;
      }

      .student-tutor-session-question {
        display: grid;
        gap: 0.16rem;
        margin: 0.44rem 0.5rem 0.46rem;
        padding: 0.38rem 0.48rem;
        border: 1px solid rgba(255,214,102,0.3);
        border-radius: 8px;
        background: rgba(42,28,8,0.24);
      }

      .student-tutor-session-question strong {
        color: #ffeeb9;
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .student-tutor-session-question p {
        margin: 0;
        color: #effff8;
        font-size: 0.84rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .student-tutor-session.is-collapsed .student-tutor-session-panel {
        max-height: 0;
        opacity: 0;
        visibility: hidden;
      }

      .student-tutor-session-scroll {
        display: grid;
        gap: 0.5rem;
        max-height: min(760px, calc(100dvh - 15rem));
        min-height: 0;
        padding: 0.06rem 0.24rem 0.06rem 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .student-tutor-session-answer strong,
      .student-tutor-session-step-head strong {
        color: #b9d8d1;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .student-tutor-session-answer p,
      .student-tutor-session-response {
        margin: 0;
        line-height: 1.3;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .student-tutor-session-steps {
        display: grid;
        gap: 0.48rem;
      }

      .student-tutor-session-step {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.48rem;
        min-width: 0;
        padding: 0.5rem;
        border: 1px solid rgba(126,233,255,0.16);
        border-radius: 8px;
        background: rgba(2,8,10,0.36);
      }

      .student-tutor-session-step.has-side-answer {
        grid-template-columns: minmax(7.4rem, 0.2fr) minmax(0, 1fr);
      }

      .student-tutor-session-step.is-current {
        border-color: rgba(126,233,255,0.48);
        background:
          linear-gradient(180deg, rgba(126,233,255,0.12), rgba(102,247,209,0.06)),
          rgba(2,8,10,0.54);
      }

      .student-tutor-session-step.is-complete {
        border-color: rgba(102,247,209,0.34);
      }

      .student-tutor-session-step.is-stopped {
        border-color: rgba(255,214,102,0.34);
      }

      .student-tutor-session-step-compact {
        padding: 0.36rem 0.44rem;
        background: rgba(2,8,10,0.24);
      }

      .student-tutor-history-row,
      .student-tutor-history-final {
        display: flex;
        align-items: center;
        gap: 0.36rem;
        flex-wrap: wrap;
        min-width: 0;
      }

      .student-tutor-history-row {
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .student-tutor-history-row:hover,
      .student-tutor-history-row:focus-visible {
        color: #effff8;
        outline: 1px solid rgba(126,233,255,0.42);
        outline-offset: 3px;
      }

      .student-tutor-just-answered-row .student-tutor-history-row {
        cursor: default;
      }

      .student-tutor-just-answered-row .student-tutor-history-row:hover,
      .student-tutor-just-answered-row .student-tutor-history-row:focus-visible {
        color: inherit;
        outline: 0;
      }

      .student-tutor-history-caret {
        color: #7ee9ff;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1;
      }

      .student-tutor-history-row strong,
      .student-tutor-history-final strong {
        color: #b9d8d1;
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-tutor-history-feedback {
        color: #dffdf6;
        font-size: 0.8rem;
        font-weight: 850;
      }

      .student-tutor-history-prompt,
      .student-tutor-history-answer,
      .student-tutor-history-final span {
        color: #effff8;
        font-size: 0.82rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .student-tutor-history-answer {
        color: #ffeeb9;
      }

      .student-tutor-history-final {
        margin-top: 0.28rem;
        padding-top: 0.3rem;
        border-top: 1px solid rgba(102,247,209,0.18);

      .student-calculator-display {

        border-color: rgba(157,255,129,0.46);
      }

      .student-calculator-button.is-equals {
        grid-column: span 1;
        border-color: rgba(102,247,209,0.52);
        color: #dffdf6;
        background:
          radial-gradient(circle at 50% 0%, rgba(102,247,209,0.18), transparent 58%),

      .student-warning {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 20;
        max-width: min(360px, calc(100vw - 2rem));
        padding: 0.8rem 0.95rem;
        border: 1px solid rgba(255, 214, 102, 0.4);
        border-radius: 10px;
        background: rgba(31, 22, 5, 0.94);
        color: #fff5ce;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      }

      .student-warning[hidden] {
        display: none;
      }

      .student-fireworks {
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        overflow: hidden;
        contain: layout paint;
      }

      .student-fireworks[hidden] {
        display: none;
      }

      .student-fireworks.is-active::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 36%, rgba(255, 255, 255, 0.2), transparent 18%),
          radial-gradient(circle at 18% 28%, rgba(255, 72, 196, 0.16), transparent 20%),
          radial-gradient(circle at 82% 30%, rgba(54, 214, 255, 0.14), transparent 22%);
        animation: student-firework-stage 3.4s ease-out forwards;
      }

      .student-firework-particle,
      .student-firework-ring {
        position: absolute;
        left: var(--origin-x, 50%);
        top: var(--origin-y, 34%);
        opacity: 0;
        will-change: transform, opacity;
      }

      .student-firework-particle {
        width: var(--spark-size, 10px);
        height: var(--spark-size, 10px);
        border-radius: 999px;
        background: var(--spark-color, #66f7d1);
        box-shadow:
          0 0 10px var(--spark-color, #66f7d1),
          0 0 24px var(--spark-color, #66f7d1),
          0 0 42px rgba(255, 255, 255, 0.42);
        filter: saturate(1.35);
        animation: student-firework-pop var(--spark-duration, 1.45s) cubic-bezier(.12,.82,.28,1) forwards;
        animation-delay: var(--spark-delay, 0s);
      }

      .student-firework-particle.is-trail {
        width: calc(var(--spark-size, 10px) * 0.62);
        height: calc(var(--spark-size, 10px) * 2.8);
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, var(--spark-color, #66f7d1), transparent);
        transform-origin: center top;
      }

      .student-firework-particle.is-glitter {
        width: var(--spark-size, 5px);
        height: var(--spark-size, 5px);
        clip-path: polygon(50% 0%, 62% 35%, 100% 50%, 62% 65%, 50% 100%, 38% 65%, 0% 50%, 38% 35%);
        animation-name: student-firework-rain;
        animation-timing-function: ease-in;
      }

      .student-firework-ring {
        width: var(--ring-size, 46px);
        height: var(--ring-size, 46px);
        border: 3px solid var(--spark-color, #7ee9ff);
        border-radius: 999px;
        box-shadow:
          0 0 18px var(--spark-color, #7ee9ff),
          inset 0 0 18px var(--spark-color, #7ee9ff);
        transform: translate(-50%, -50%) scale(0.18);
        animation: student-firework-ring var(--spark-duration, 1.4s) ease-out forwards;
        animation-delay: var(--spark-delay, 0s);
      }

      @keyframes student-firework-stage {
        0%,
        100% {
          opacity: 0;
        }
        12%,
        72% {
          opacity: 1;
        }
      }

      @keyframes student-firework-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(var(--spark-rotate, 0deg)) scale(0.22);
        }
        12% {
          opacity: 1;
        }
        42% {
          opacity: 0.96;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--spark-x, 0px)), calc(-50% + var(--spark-y, 0px))) rotate(var(--spark-rotate, 0deg)) scale(var(--spark-scale, 1));
        }
      }

      @keyframes student-firework-rain {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(0deg) scale(0.5);
        }
        18% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--spark-x, 0px)), calc(-50% + var(--spark-y, 180px))) rotate(var(--spark-rotate, 220deg)) scale(0.85);
        }
      }

      @keyframes student-firework-ring {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.12);
        }
        16% {
          opacity: 0.82;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(var(--ring-scale, 3.2));
        }
      }

      .balancing-workspace {
        display: grid;

        padding: 0.78rem;
        border: 1px solid rgba(126, 233, 255, 0.26);

      }

      .balancing-protected-equation {

      .balancing-coefficient-select {

      }

      .balancing-element-token {

      .balancing-protected-note,

      .balancing-placement-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        min-height: 2rem;

      }

      .balancing-placement-chip {

      }

      .balancing-count-column p {
        display: grid;

        align-items: baseline;
        gap: 0.35rem;

        justify-self: end;
      }

      .balancing-workspace-actions {

      .balancing-reduction-note {

        background: rgba(255, 230, 106, 0.08);

      .balancing-reduction-step {

        padding: 0.68rem;
        border: 1px solid rgba(255, 230, 106, 0.38);

      .balancing-reduction-step legend {

          width: calc(100% - 0.8rem);
          padding: 0.5rem 0;
          gap: 0.5rem;
        }

        .student-status-bar {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .student-energy {
          width: 100%;
        }

        .student-status-actions {
          justify-content: flex-start;
        }

        .student-composer {
          grid-template-columns: 1fr;
        }

        .student-composer-actions {
          width: 100%;

          grid-template-columns: minmax(78px, 0.8fr) repeat(3, minmax(54px, auto));
        }

          max-width: 94%;

        .student-chat-message.has-tutor {

        }

        .student-tutor-session {

        }

      @media (prefers-reduced-motion: reduce) {

        .student-tutor-session-toggle {
          transition: none;
        }

        .student-fireworks {
          display: none;
        }
      }

  <body>
    <main class="student-shell">
      <header class="student-status-bar" aria-label="Student session status">
        <div class="student-status-copy">
          <h1 class="student-status-title">Charlemagne Student Chat</h1>
          <div class="student-status-meta">
            <p class="student-session" id="studentSessionMessage">Checking your classroom session...</p>
            <p class="student-session">Session: <strong id="sessionIdText">Missing session</strong></p>
          </div>
        </div>
        <div class="student-status-actions">
          <span id="studentStatus" class="status-pill">Checking link</span>
          <span id="studentRouteInfo" class="stream-status">No route yet</span>
        </div>
        <div id="studentQuestionEnergy" class="student-energy" role="status" aria-live="polite" hidden>
          <div class="student-energy-top">
            <strong>Question Energy</strong>
            <span id="studentQuestionEnergyValue" class="student-energy-value">Question limit: Off</span>
          </div>
          <div class="student-energy-track" aria-hidden="true">
            <div id="studentQuestionEnergyFill" class="student-energy-fill"></div>
          </div>
          <span id="studentQuestionEnergyHelper" class="student-energy-helper"></span>
        </div>
      </header>

      <section id="studentTimeline" class="student-timeline" aria-live="polite" aria-label="Conversation timeline">
        <p class="student-empty-timeline">Ask a question to start a conversation. Guided math/formula tutor work, calculator checks, and final answers will appear here.</p>
      </section>

      <form id="studentMessageForm" class="student-composer" aria-label="Ask Charlemagne">
        <label class="sr-only" for="studentMessageInput">Message</label>
        <div id="studentComposerTutorChoices" class="student-composer-tutor-choices" aria-label="Current answer choices" hidden></div>
        <textarea
          id="studentMessageInput"
          name="message"
          placeholder="Ask a science question..."
          rows="2"
        ></textarea>
        <div class="student-composer-actions">
          <button type="submit" id="studentSendButton" class="panel-action-button student-send-button">Send</button>
          <button type="button" id="studentAskHighlightButton" class="panel-action-button student-highlight-button">Ask highlighted text</button>
          <button type="button" id="studentPointButton" class="panel-action-button student-point-button">Point?</button>
          <button type="button" id="studentClearButton" class="panel-action-button student-clear-button">Clear</button>
        </div>
      </form>
    </main>

    <div id="studentTutorFireworks" class="student-fireworks" aria-hidden="true" hidden></div>
    <div id="studentFrictionWarning" class="student-warning" role="status" aria-live="polite" hidden></div>

    <script src="/ui-state.js"></script>
    <script src="/api-client.js"></script>
    <script src="/student/student-ui.js"></script>
  </body>
</html>
