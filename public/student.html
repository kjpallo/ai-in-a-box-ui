<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlemagne Student Help</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .student-shell {
        width: min(1080px, calc(100% - 1rem));
        height: 100dvh;
        margin: 0 auto;
        padding: 0.5rem 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0.5rem;
      }

      .student-status-bar,
      .student-composer {
        min-width: 0;
        padding: 0.56rem 0.62rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 8px;
        background:
          radial-gradient(circle at 12% 0%, rgba(102,247,209,0.12), transparent 36%),
          radial-gradient(circle at 90% 0%, rgba(126,233,255,0.1), transparent 32%),
          rgba(3,12,14,0.9);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(102,247,209,0.08);
      }

      .student-status-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(150px, 210px);
        align-items: center;
        gap: 0.5rem;
      }

      .student-status-copy {
        display: grid;
        gap: 0.22rem;
        min-width: 0;
      }

      .student-status-title {
        margin: 0;
        color: #f5fffb;
        font-size: clamp(0.95rem, 1.5vw, 1.16rem);
        letter-spacing: 0.08em;
        line-height: 1.08;
        text-transform: uppercase;
      }

      .student-status-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.75rem;
        align-items: center;
        min-width: 0;
      }

      .student-session {
        margin: 0;
        color: #b9d8d1;
        font-size: 0.78rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .student-status-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .student-energy {
        display: grid;
        align-content: center;
        gap: 0.16rem;
        min-width: 0;
        padding: 0.28rem 0.38rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 7px;
        background: rgba(4,14,17,0.62);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 22px rgba(102,247,209,0.08);
      }

      .student-energy[hidden] {
        display: none;
      }

      .student-energy-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.45rem;
        color: #dffdf6;
        font-size: 0.72rem;
      }

      .student-energy-top strong {
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-energy-value {
        color: #b9d8d1;
        font-size: 0.72rem;
        text-align: right;
      }

      .student-energy-helper {
        color: #7ee9ff;
        font-size: 0.68rem;
        line-height: 1.2;
      }

      .student-energy-track {
        height: 6px;
        padding: 1px;
        border: 1px solid rgba(126,233,255,0.3);
        border-radius: 999px;
        background: rgba(0,0,0,0.38);
        box-shadow: inset 0 0 12px rgba(0,0,0,0.42);
      }

      .student-energy-fill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #66f7d1, #7ee9ff);
        box-shadow: 0 0 14px rgba(102,247,209,0.56), 0 0 22px rgba(126,233,255,0.26);
        transition: width 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .student-energy.is-low .student-energy-fill {
        background: linear-gradient(90deg, #ffd666, #ff9f43);
        box-shadow: 0 0 14px rgba(255,214,102,0.48), 0 0 24px rgba(255,159,67,0.22);
      }

      .student-energy.is-empty .student-energy-fill {
        background: linear-gradient(90deg, #7f1d1d, #ff6b6b);
        box-shadow: 0 0 14px rgba(255,107,107,0.38);
      }

      .student-energy.is-off .student-energy-track {
        border-color: rgba(102,247,209,0.24);
      }

      .student-timeline {
        min-height: 0;
        width: 100%;
        padding: 0.65rem;
        display: grid;
        align-content: start;
        gap: 0.72rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        border: 1px solid rgba(102,247,209,0.18);
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(4,16,18,0.92), rgba(2,8,10,0.94)),
          rgba(2,8,10,0.94);
      }

      .student-empty-timeline {
        align-self: center;
        justify-self: center;
        max-width: 36rem;
        padding: 1rem;
        border: 1px solid rgba(126,233,255,0.18);
        border-radius: 10px;
        background: rgba(2,8,10,0.42);
        color: #b9d8d1;
        line-height: 1.45;
        text-align: center;
      }

      .student-chat-turn {
        display: grid;
        gap: 0.38rem;
      }

      .student-chat-message {
        display: grid;
        gap: 0.25rem;
        max-width: min(940px, 88%);
      }

      .student-chat-message.is-user {
        justify-self: end;
        max-width: min(760px, 76%);
      }

      .student-chat-message.is-assistant,
      .student-chat-message.is-system {
        justify-self: start;
      }

      .student-chat-message.has-tutor {
        max-width: min(1000px, 94%);
      }

      .student-message-meta {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex-wrap: wrap;
        color: #b9d8d1;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-chat-message.is-user .student-message-meta {
        justify-content: flex-end;
      }

      .student-message-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .student-message-bubble {
        padding: 0.66rem 0.78rem;
        border: 1px solid rgba(126,233,255,0.2);
        border-radius: 10px;
        color: #effff8;
        line-height: 1.42;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .student-chat-message.is-user .student-message-bubble {
        border-color: rgba(126,233,255,0.32);
        background:
          linear-gradient(180deg, rgba(17,57,66,0.88), rgba(5,24,29,0.9));
      }

      .student-chat-message.is-assistant .student-message-bubble {
        border-color: rgba(102,247,209,0.24);
        background:
          linear-gradient(180deg, rgba(5,29,29,0.78), rgba(2,12,14,0.88));
      }

      .student-chat-message.is-system .student-message-bubble {
        border-color: rgba(255,214,102,0.34);
        background: rgba(31, 22, 5, 0.62);
        color: #fff5ce;
      }

      .student-chat-message.is-pending .student-message-bubble {
        color: rgba(223,253,246,0.68);
        font-style: italic;
      }

      .student-chat-message.has-tutor .student-message-bubble {
        padding: 0.44rem;
      }

      .student-tutor-feedback {
        margin: 0 0 0.4rem;
        color: #dffdf6;
        font-size: 0.9rem;
        line-height: 1.3;
        white-space: normal;
      }

      .student-route-chip {
        color: #7ee9ff;
        letter-spacing: 0;
        text-transform: none;
      }

      .student-inline-button,
      .student-tutor-session-toggle,
      .panel-action-button {
        min-height: 32px;
        padding: 0.42rem 0.64rem;
        border: 1px solid rgba(126,233,255,0.52);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 18%, rgba(239,255,248,0.2), transparent 22%),
          radial-gradient(circle at 50% 28%, rgba(126,233,255,0.2), transparent 58%),
          linear-gradient(180deg, rgba(22,72,82,0.98), rgba(5,28,34,0.98));
        color: #effff8;
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0;
        box-shadow:
          0 3px 0 rgba(3,20,24,0.92),
          0 0 18px rgba(126,233,255,0.16),
          inset 0 1px 0 rgba(255,255,255,0.16);
        transition: transform 110ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .student-inline-button:hover,
      .student-inline-button:focus-visible,
      .student-tutor-session-toggle:hover,
      .student-tutor-session-toggle:focus-visible,
      .panel-action-button:hover,
      .panel-action-button:focus-visible {
        border-color: rgba(102,247,209,0.78);
        box-shadow:
          0 3px 0 rgba(3,20,24,0.92),
          0 0 24px rgba(102,247,209,0.28),
          inset 0 1px 0 rgba(255,255,255,0.22);
        outline: none;
      }

      .student-inline-button:active,
      .student-tutor-session-toggle:active,
      .panel-action-button:active {
        transform: translateY(2px);
        box-shadow:
          0 1px 0 rgba(3,20,24,0.92),
          0 0 24px rgba(126,233,255,0.32);
      }

      .student-inline-button:disabled,
      .student-tutor-session-toggle:disabled,
      .panel-action-button:disabled {
        border-color: rgba(126,233,255,0.18);
        background: rgba(6,20,23,0.62);
        color: rgba(223,253,246,0.5);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        transform: none;
      }

      .student-composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.48rem;
      }

      .student-composer textarea {
        width: 100%;
        min-height: 52px;
        max-height: 120px;
        resize: vertical;
      }

      .student-composer-actions {
        display: grid;
        grid-template-columns: minmax(68px, 0.8fr) repeat(3, minmax(48px, auto));
        align-items: center;
        gap: 0.34rem;
        min-width: 0;
        width: min(430px, 44vw);
      }

      .student-send-button {
        grid-column: auto;
        min-height: 40px;
        border-color: rgba(102,247,209,0.56);
        color: #dffdf6;
        background:
          radial-gradient(circle at 50% 0%, rgba(102,247,209,0.18), transparent 55%),
          linear-gradient(180deg, rgba(13,48,47,0.98), rgba(3,22,25,0.98));
      }

      .student-highlight-button,
      .student-point-button,
      .student-clear-button {
        min-height: 32px;
        padding-inline: 0.5rem;
        font-size: 0.72rem;
        line-height: 1.18;
      }

      .student-clear-button {
        border-color: rgba(126,233,255,0.26);
        color: #b9d8d1;
        background: rgba(6,20,23,0.62);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .student-tutor-session {
        justify-self: start;
        display: grid;
        gap: 0.5rem;
        width: min(1000px, 94%);
        padding: 0.58rem;
        border: 1px solid rgba(102,247,209,0.3);
        border-radius: 10px;
        background:
          radial-gradient(circle at 16% 0%, rgba(102,247,209,0.12), transparent 34%),
          radial-gradient(circle at 90% 8%, rgba(126,233,255,0.1), transparent 30%),
          linear-gradient(180deg, rgba(5,29,29,0.84), rgba(2,12,14,0.92));
        color: #effff8;
        white-space: normal;
      }

      .student-tutor-session.is-complete {
        border-color: rgba(102,247,209,0.5);
      }

      .student-tutor-session.is-stopped {
        border-color: rgba(255,214,102,0.42);
      }

      .student-tutor-session-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.62rem;
      }

      .student-tutor-session-summary {
        display: grid;
        gap: 0.16rem;
        min-width: 0;
      }

      .student-tutor-session-summary strong {
        color: #f5fffb;
        font-size: 0.94rem;
        line-height: 1.18;
        overflow-wrap: anywhere;
      }

      .student-tutor-session-summary span {
        color: #7ee9ff;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .student-tutor-session-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.38rem;
        flex-wrap: wrap;
        color: #b9d8d1;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .student-tutor-session-panel {
        max-height: min(980px, calc(100dvh - 11rem));
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition: max-height 220ms ease, opacity 180ms ease, visibility 180ms ease;
      }

      .student-tutor-session.is-collapsed .student-tutor-session-panel {
        max-height: 0;
        opacity: 0;
        visibility: hidden;
      }

      .student-tutor-session-scroll {
        display: grid;
        gap: 0.5rem;
        max-height: min(760px, calc(100dvh - 15rem));
        min-height: 0;
        padding: 0.06rem 0.24rem 0.06rem 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .student-tutor-session-answer strong,
      .student-tutor-session-step-head strong {
        color: #b9d8d1;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .student-tutor-session-answer p,
      .student-tutor-session-response {
        margin: 0;
        line-height: 1.3;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .student-tutor-session-steps {
        display: grid;
        gap: 0.48rem;
      }

      .student-tutor-session-step {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.48rem;
        min-width: 0;
        padding: 0.5rem;
        border: 1px solid rgba(126,233,255,0.16);
        border-radius: 8px;
        background: rgba(2,8,10,0.36);
      }

      .student-tutor-session-step.has-side-answer {
        grid-template-columns: minmax(7.4rem, 0.2fr) minmax(0, 1fr);
      }

      .student-tutor-session-step.is-current {
        border-color: rgba(126,233,255,0.48);
        background:
          linear-gradient(180deg, rgba(126,233,255,0.12), rgba(102,247,209,0.06)),
          rgba(2,8,10,0.54);
      }

      .student-tutor-session-step.is-complete {
        border-color: rgba(102,247,209,0.34);
      }

      .student-tutor-session-step.is-stopped {
        border-color: rgba(255,214,102,0.34);
      }

      .student-tutor-session-answer,
      .student-tutor-session-step-work {
        display: grid;
        align-content: start;
        gap: 0.36rem;
        min-width: 0;
      }

      .student-tutor-session-answer {
        padding: 0.4rem 0.46rem;
        border: 1px solid rgba(126,233,255,0.14);
        border-radius: 7px;
        background: rgba(126,233,255,0.06);
      }

      .student-tutor-session-answer p {
        color: #effff8;
        font-size: 0.86rem;
      }

      .student-tutor-session-step-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .student-tutor-session-step-head span {
        color: #7ee9ff;
        font-size: 0.74rem;
        font-weight: 800;
      }

      .student-tutor-session-response {
        padding: 0.46rem 0.52rem;
        border: 1px solid rgba(102,247,209,0.16);
        border-radius: 7px;
        background: rgba(4,20,20,0.42);
        color: #dffdf6;
      }

      .student-tutor-card {
        display: grid;
        gap: 0.44rem;
        margin-top: 0;
        padding: 0.54rem;
        border: 1px solid rgba(102,247,209,0.28);
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 0%, rgba(102,247,209,0.12), transparent 34%),
          radial-gradient(circle at 88% 12%, rgba(126,233,255,0.1), transparent 32%),
          rgba(3,12,14,0.82);
        white-space: normal;
      }

      .student-tutor-card.is-complete {
        border-color: rgba(102,247,209,0.46);
      }

      .student-tutor-card.is-stopped {
        border-color: rgba(255,214,102,0.42);
      }

      .student-tutor-summary {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.5rem;
        padding: 0.48rem 0.58rem;
        border: 1px solid rgba(102,247,209,0.32);
        border-radius: 10px;
        background: rgba(4,20,20,0.7);
        color: #effff8;
        text-align: left;
      }

      .student-tutor-summary strong,
      .student-tutor-summary span {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .student-tutor-summary span {
        color: #b9d8d1;
        font-size: 0.84rem;
      }

      .student-tutor-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .student-tutor-meta h2 {
        margin: 0;
        color: #f5fffb;
        font-size: 0.96rem;
        line-height: 1.15;
      }

      .student-tutor-progress {
        color: #7ee9ff;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .student-tutor-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.42rem;
        min-height: 0;
      }

      .student-tutor-grid {
        display: grid;
        gap: 0.26rem;
        min-width: 0;
      }

      .student-tutor-detail {
        display: grid;
        grid-template-columns: minmax(6.6rem, 0.28fr) minmax(0, 1fr);
        align-items: baseline;
        gap: 0.36rem;
        min-width: 0;
        padding: 0.28rem 0.42rem;
        border: 1px solid rgba(126,233,255,0.14);
        border-radius: 7px;
        background: rgba(2,8,10,0.36);
      }

      .student-tutor-detail.is-wide,
      .student-tutor-detail.student-tutor-current-step {
        grid-template-columns: minmax(6.6rem, 0.24fr) minmax(0, 1fr);
      }

      .student-tutor-detail.student-tutor-current-step {
        padding: 0.34rem 0.46rem;
        border-color: rgba(126,233,255,0.56);
        background:
          linear-gradient(180deg, rgba(126,233,255,0.16), rgba(102,247,209,0.08)),
          rgba(2,8,10,0.56);
      }

      .student-tutor-detail.student-tutor-original-question {
        border-color: rgba(255,214,102,0.32);
        background: rgba(42,28,8,0.26);
      }

      .student-tutor-detail.student-tutor-answer,
      .student-tutor-detail.student-tutor-check {
        border-color: rgba(102,247,209,0.28);
        background: rgba(4,17,18,0.5);
      }

      .student-tutor-detail strong {
        color: #b9d8d1;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .student-tutor-detail span,
      .student-tutor-detail p {
        margin: 0;
        color: #effff8;
        line-height: 1.25;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .student-tutor-pending {
        color: rgba(223,253,246,0.54);
        font-size: 0.82rem;
        font-style: italic;
      }

      .student-tutor-known-values {
        display: grid;
        gap: 0.16rem;
        margin: 0;
      }

      .student-tutor-known-values div {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
        color: #effff8;
      }

      .student-tutor-known-values dt {
        color: #b9d8d1;
      }

      .student-tutor-known-values dd {
        margin: 0;
        font-weight: 800;
      }

      .student-tutor-actions {
        display: flex;
        gap: 0.32rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
      }

      .student-calculator {
        display: grid;
        gap: 0.34rem;
        align-self: start;
        min-width: 0;
        width: min(100%, 320px);
        margin: 0;
        padding: 0.48rem;
        border: 1px solid rgba(102,247,209,0.24);
        border-radius: 10px;
        background:
          radial-gradient(circle at 50% 0%, rgba(102,247,209,0.14), transparent 56%),
          linear-gradient(180deg, rgba(5,25,27,0.92), rgba(2,9,11,0.92));
        box-shadow:
          0 0 28px rgba(102,247,209,0.1),
          inset 0 1px 0 rgba(255,255,255,0.07);
      }

      .student-calculator[hidden] {
        display: none;
      }

      .student-calculator-toggle {
        justify-self: start;
      }

      .student-calculator-display {
        min-height: 32px;
        padding: 0.36rem 0.5rem;
        border: 1px solid rgba(157,255,129,0.48);
        border-radius: 7px;
        background:
          linear-gradient(180deg, rgba(16,45,28,0.96), rgba(4,24,16,0.98));
        color: #b8ff89;
        font-family: "Courier New", monospace;
        font-size: 1rem;
        font-weight: 800;
        line-height: 1.1;
        text-align: right;
        overflow-wrap: anywhere;
        text-shadow: 0 0 10px rgba(184,255,137,0.8);
        box-shadow:
          0 0 24px rgba(157,255,129,0.2),
          inset 0 0 18px rgba(157,255,129,0.08),
          inset 0 1px 0 rgba(255,255,255,0.14);
      }

      .student-calculator-keys {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.28rem;
      }

      .student-calculator-button {
        min-height: 32px;
        min-width: 0;
        border: 1px solid rgba(126,233,255,0.34);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(16,45,52,0.98), rgba(4,17,21,0.98));
        color: #effff8;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0;
        box-shadow:
          0 3px 0 rgba(2,12,15,0.92),
          0 0 16px rgba(126,233,255,0.1),
          inset 0 1px 0 rgba(255,255,255,0.1);
      }

      .student-calculator-button:hover,
      .student-calculator-button:focus-visible {
        border-color: rgba(102,247,209,0.7);
        outline: none;
      }

      .student-calculator-button:active {
        transform: translateY(2px);
      }

      .student-calculator-button.is-operator {
        color: #7ee9ff;
        border-color: rgba(126,233,255,0.48);
        background:
          linear-gradient(180deg, rgba(17,57,66,0.98), rgba(4,22,28,0.98));
      }

      .student-calculator-button.is-clear {
        color: #ffd666;
        border-color: rgba(255,214,102,0.5);
      }

      .student-calculator-button.is-backspace {
        color: #ffefb5;
        border-color: rgba(255,214,102,0.4);
      }

      .student-calculator-button.is-fraction {
        color: #b8ff89;
        border-color: rgba(157,255,129,0.4);
      }

      .student-calculator-button.is-sqrt {
        color: #b8ff89;
        border-color: rgba(157,255,129,0.46);
      }

      .student-calculator-button.is-equals {
        grid-column: span 2;
        border-color: rgba(102,247,209,0.52);
        color: #dffdf6;
        background:
          radial-gradient(circle at 50% 0%, rgba(102,247,209,0.18), transparent 58%),
          linear-gradient(180deg, rgba(16,74,65,0.98), rgba(4,25,28,0.98));
      }

      .student-warning {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 20;
        max-width: min(360px, calc(100vw - 2rem));
        padding: 0.8rem 0.95rem;
        border: 1px solid rgba(255, 214, 102, 0.4);
        border-radius: 10px;
        background: rgba(31, 22, 5, 0.94);
        color: #fff5ce;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      }

      .student-warning[hidden] {
        display: none;
      }

      .student-fireworks {
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        overflow: hidden;
      }

      .student-fireworks[hidden] {
        display: none;
      }

      .student-firework-burst {
        position: absolute;
        top: 22%;
        width: 150px;
        height: 150px;
        transform: translateY(-50%);
      }

      .student-firework-burst.is-left {
        left: clamp(0.5rem, 4vw, 3rem);
      }

      .student-firework-burst.is-right {
        right: clamp(0.5rem, 4vw, 3rem);
      }

      .student-firework-burst span {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--spark-color, #66f7d1);
        box-shadow: 0 0 14px var(--spark-color, #66f7d1);
        opacity: 0;
        animation: student-firework-pop 1.15s ease-out forwards;
        animation-delay: var(--spark-delay, 0s);
      }

      .student-firework-burst span:nth-child(1) { --spark-x: 0px; --spark-y: -70px; --spark-color: #66f7d1; }
      .student-firework-burst span:nth-child(2) { --spark-x: 50px; --spark-y: -50px; --spark-color: #7ee9ff; --spark-delay: 0.04s; }
      .student-firework-burst span:nth-child(3) { --spark-x: 72px; --spark-y: 0px; --spark-color: #ffd666; --spark-delay: 0.08s; }
      .student-firework-burst span:nth-child(4) { --spark-x: 50px; --spark-y: 50px; --spark-color: #ff8ff0; --spark-delay: 0.02s; }
      .student-firework-burst span:nth-child(5) { --spark-x: 0px; --spark-y: 72px; --spark-color: #66f7d1; --spark-delay: 0.1s; }
      .student-firework-burst span:nth-child(6) { --spark-x: -50px; --spark-y: 50px; --spark-color: #7ee9ff; --spark-delay: 0.05s; }
      .student-firework-burst span:nth-child(7) { --spark-x: -72px; --spark-y: 0px; --spark-color: #ffd666; --spark-delay: 0.09s; }
      .student-firework-burst span:nth-child(8) { --spark-x: -50px; --spark-y: -50px; --spark-color: #ff8ff0; --spark-delay: 0.03s; }

      @keyframes student-firework-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.25);
        }
        18% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--spark-x)), calc(-50% + var(--spark-y))) scale(1);
        }
      }

      @media (max-width: 820px) {
        .student-shell {
          width: calc(100% - 0.8rem);
          padding: 0.5rem 0;
          gap: 0.5rem;
        }

        .student-status-bar {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .student-energy {
          width: 100%;
        }

        .student-status-actions {
          justify-content: flex-start;
        }

        .student-composer {
          grid-template-columns: 1fr;
        }

        .student-composer-actions {
          width: 100%;
          min-width: 0;
          grid-template-columns: minmax(78px, 0.8fr) repeat(3, minmax(54px, auto));
        }

        .student-chat-message {
          max-width: 94%;
        }

        .student-chat-message.has-tutor {
          max-width: 98%;
        }

        .student-tutor-session {
          width: 98%;
        }

        .student-tutor-session-header {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .student-tutor-session-meta {
          justify-content: flex-start;
        }

        .student-tutor-body,
        .student-tutor-grid,
        .student-tutor-session-step {
          grid-template-columns: 1fr;
        }

        .student-tutor-detail,
        .student-tutor-detail.is-wide,
        .student-tutor-detail.student-tutor-current-step {
          grid-template-columns: minmax(6rem, 0.34fr) minmax(0, 1fr);
        }

        .student-calculator {
          width: 100%;
        }
      }

      @media (max-width: 520px) {
        .student-status-title {
          font-size: 0.98rem;
        }

        .student-status-bar,
        .student-composer,
        .student-timeline {
          padding: 0.5rem;
        }

        .student-composer textarea {
          min-height: 50px;
        }

        .student-composer-actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .student-send-button {
          grid-column: 1 / -1;
        }

        .student-chat-message {
          max-width: 100%;
        }

        .student-chat-message.is-user {
          max-width: 92%;
        }

        .student-tutor-detail,
        .student-tutor-detail.is-wide,
        .student-tutor-detail.student-tutor-current-step {
          grid-template-columns: 1fr;
        }

        .student-tutor-summary {
          grid-template-columns: 1fr;
        }

        .student-tutor-session {
          width: 100%;
          padding: 0.5rem;
        }

        .student-tutor-session-scroll {
          max-height: min(620px, calc(100dvh - 14rem));
        }

        .student-tutor-session-meta {
          align-items: stretch;
        }

        .student-calculator-button {
          min-height: 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .student-tutor-session-panel,
        .student-tutor-session-toggle {
          transition: none;
        }

        .student-firework-burst span {
          animation-duration: 0.45s;
        }
      }
    </style>
  </head>
  <body>
    <main class="student-shell">
      <header class="student-status-bar" aria-label="Student session status">
        <div class="student-status-copy">
          <h1 class="student-status-title">Charlemagne Student Chat</h1>
          <div class="student-status-meta">
            <p class="student-session" id="studentSessionMessage">Checking your classroom session...</p>
            <p class="student-session">Session: <strong id="sessionIdText">Missing session</strong></p>
          </div>
        </div>
        <div class="student-status-actions">
          <span id="studentStatus" class="status-pill">Checking link</span>
          <span id="studentRouteInfo" class="stream-status">No route yet</span>
        </div>
        <div id="studentQuestionEnergy" class="student-energy" role="status" aria-live="polite" hidden>
          <div class="student-energy-top">
            <strong>Question Energy</strong>
            <span id="studentQuestionEnergyValue" class="student-energy-value">Question limit: Off</span>
          </div>
          <div class="student-energy-track" aria-hidden="true">
            <div id="studentQuestionEnergyFill" class="student-energy-fill"></div>
          </div>
          <span id="studentQuestionEnergyHelper" class="student-energy-helper"></span>
        </div>
      </header>

      <section id="studentTimeline" class="student-timeline" aria-live="polite" aria-label="Conversation timeline">
        <p class="student-empty-timeline">Ask a question to start a conversation. Guided tutor work, calculator checks, and final answers will appear here.</p>
      </section>

      <form id="studentMessageForm" class="student-composer" aria-label="Ask Charlemagne">
        <label class="sr-only" for="studentMessageInput">Message</label>
        <textarea
          id="studentMessageInput"
          name="message"
          placeholder="Ask a science question..."
          rows="2"
        ></textarea>
        <div class="student-composer-actions">
          <button type="submit" id="studentSendButton" class="panel-action-button student-send-button">Send</button>
          <button type="button" id="studentAskHighlightButton" class="panel-action-button student-highlight-button">Ask highlighted text</button>
          <button type="button" id="studentPointButton" class="panel-action-button student-point-button">Point?</button>
          <button type="button" id="studentClearButton" class="panel-action-button student-clear-button">Clear</button>
        </div>
      </form>
    </main>

    <div id="studentTutorFireworks" class="student-fireworks" aria-hidden="true" hidden>
      <div class="student-firework-burst is-left">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="student-firework-burst is-right">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div id="studentFrictionWarning" class="student-warning" role="status" aria-live="polite" hidden></div>

    <script src="/ui-state.js"></script>
    <script src="/api-client.js"></script>
    <script src="/student/student-ui.js"></script>
  </body>
</html>
